<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JobScout — Feedback Recorded</title>
  <script>setTimeout(() => window.close(), 2000);</script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f4f6f9;
      color: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      padding: 40px 48px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      text-align: center;
    }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    .meta { font-size: 14px; color: #64748b; margin-bottom: 24px; }
    .action-label {
      display: inline-block;
      background: #6366f1;
      color: #fff;
      border-radius: 20px;
      padding: 6px 18px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 24px;
    }
    .undo {
      font-size: 13px;
      color: #94a3b8;
    }
    .undo a {
      color: #6366f1;
      text-decoration: none;
    }
    .undo a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✓</div>
    <h1>Feedback Recorded</h1>
    <div class="meta">
      <strong>{{.Title}}</strong><br>{{.Company}}
    </div>
    <div class="action-label">{{.ActionLabel}}</div>
    <div class="undo">
      Changed your mind? <a href="{{.UndoURL}}">Undo this feedback</a>
    </div>
    <p style="font-size:12px;color:#cbd5e1;margin-top:16px;">This tab will close automatically.</p>
  </div>
</body>
</html>
