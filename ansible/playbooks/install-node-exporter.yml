---
- name: Install Prometheus Node Exporter
  hosts: all
  become: true
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_os_family == 'Debian'

    - name: Install prometheus-node-exporter
      apt:
        name: prometheus-node-exporter
        state: present
      when: ansible_os_family == 'Debian'

    - name: Ensure node_exporter is started and enabled
      service:
        name: prometheus-node-exporter
        state: started
        enabled: yes
