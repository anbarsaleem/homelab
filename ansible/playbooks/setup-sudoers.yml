- name: add sudoers with ssh keys
  hosts:
    - proxmox
    - pi
    - proxmox_all_lxc
  become: yes
  gather_facts: no
  vars:
    users:
      - name: anbar
        github: anbarsaleem
        password: "{{ vault_anbar_password }}"
  tasks:
    - name: add sudo
      apt:
        name: sudo
        state: present
    - name: add user
      user:
        name: "{{ item.name }}"
        password: "{{ item.password }}"
        shell: /bin/bash
      with_items: "{{ users }}"
    - name: enable passwordless sudo
      lineinfile:
        dest: /etc/sudoers.d/99-ansible-users
        state: present
        mode: 0440
        create: yes
        regexp: '^{{ item.name }}\s'
        line: '{{ item.name }} ALL=(ALL) NOPASSWD: ALL'
        validate: 'visudo -cf %s'
      with_items: "{{ users }}"

    - name: add users' GitHub SSH keys
      authorized_key:
        user: "{{ item.name }}"
        key: "https://github.com/{{ item.github }}.keys"
      with_items: "{{ users }}"

